[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "connection_hub"
description = "Manages lobbies and player connections in the games."
version = "0.1.0"
requires-python = "==3.13.*"

dependencies = [
    "uuid7==0.1.*",
    "python-json-logger==3.3.*",
    "redis==7.4.*",
    "nats-py==2.15.*",
    "httpx==0.28.*",
    "dishka==1.10.*",
    "adaptix==3.0.0b12",
    "cyclopts==4.20.*",
    "taskiq==0.12.*",
    "faststream[nats,cli]==0.6.*",
    "taskiq-redis==1.2.*",
    "taskiq-nats==0.6.*",
    "tenacity==9.1.*",
]

[project.optional-dependencies]
dev = [
    "mypy==2.0.*",
    "ruff==0.15.*",
    "pre-commit==4.6.*",
    "pytest==9.0.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.0.*",
    "cosmic-ray==8.4.*",
]

[project.scripts]
connection-hub = "connection_hub.main.cli:main"
